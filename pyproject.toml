[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-threat-detection"
version = "1.0.0"
description = "Enterprise-grade Identity and Access Management Threat Detection System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Solution Architect Team", email = "team@example.com"}
]
keywords = ["iam", "security", "threat-detection", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "psycopg2-binary==2.9.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-dateutil==2.8.2",
    "pytz==2023.3",
    "geoip2==4.7.0",
    "httpx==0.25.2",
    "pydantic-email-validator==2.1.0",
    "structlog==23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "isort==5.13.2",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "pylint==3.0.3",
    "pre-commit==3.5.0",
]
docs = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.4.14",
]
prod = [
    "gunicorn==21.2.0",
    "prometheus-client==0.19.0",
]

[tool.setuptools]
packages = ["iam_threat_detection"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/iam_threat_detection --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["src/iam_threat_detection"]
omit = ["*/tests/*", "*/__init__.py"]
